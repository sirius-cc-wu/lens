name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-rust:
    name: Native Rust (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@1.75
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - name: Run native Rust tests
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Lint native Rust code
        run: >
          cargo clippy --locked --target ${{ matrix.target }}
          --all-targets --all-features -- -D warnings
      - name: Verify Cargo package metadata
        run: cargo package --locked

  browser:
    name: Compiled browser behavior
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@1.75
        with:
          components: rustfmt
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Run browser tests
        run: npm run test:browser
